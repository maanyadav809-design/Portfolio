  <circle cx="103" cy="63" r="5" fill="#F59E0B"/>
  <circle cx="119" cy="63" r="5" fill="#10B981"/>

  <text x="145" y="67" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Student_Management_System.cpp</text>

