    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="250" y1="0" x2="250" y2="360"/>
    <line x1="350" y1="0" x2="350" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="550" y1="0" x2="550" y2="360"/>
  </g>

  <!-- Glow effect -->
  <circle cx="280" cy="180" r="130" fill="#0284C7" opacity="0.15" filter="blur(35px)"/>

  <!-- System Window Frame -->
  <rect x="65" y="45" width="470" height="270" rx="12" fill="url(#cardGrad2)" stroke="#1E3A8A" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="65" y="45" width="470" height="36" rx="12" fill="#0B1528"/>
  <rect x="65" y="69" width="470" height="12" fill="#0B1528"/>
  <line x1="65" y1="81" x2="535" y2="81" stroke="#1E293B" stroke-width="1"/>

  <!-- Control Dots -->
