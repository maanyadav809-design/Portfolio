  <text x="245" y="193" fill="#E2E8F0" font-family="sans-serif" font-size="9">Alex Rivera</text>
  <text x="365" y="193" fill="#38BDF8" font-family="sans-serif" font-size="9">CSE</text>
  <text x="455" y="193" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">9.4</text>

  <!-- Table Row 2 -->
  <line x1="180" y1="230" x2="520" y2="230" stroke="#1E293B" stroke-width="1"/>
  <text x="195" y="221" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="9">CS-102</text>
  <text x="245" y="221" fill="#E2E8F0" font-family="sans-serif" font-size="9">Priya Sharma</text>
  <text x="365" y="221" fill="#38BDF8" font-family="sans-serif" font-size="9">CSE</text>
  <text x="455" y="221" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">9.1</text>

  <!-- Table Row 3 -->
  <line x1="180" y1="258" x2="520" y2="258" stroke="#1E293B" stroke-width="1"/>
  <text x="195" y="249" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="9">CS-103</text>
  <text x="245" y="249" fill="#E2E8F0" font-family="sans-serif" font-size="9">Ethan Chen</text>
  <text x="365" y="249" fill="#818CF8" font-family="sans-serif" font-size="9">IT</text>
  <text x="455" y="249" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">8.8</text>

  <!-- Status pill bottom right -->
