  <text x="83" y="192" fill="#64748B" font-family="sans-serif" font-size="9">Grades</text>
  <text x="83" y="212" fill="#64748B" font-family="sans-serif" font-size="9">Reports</text>

  <!-- Main Dashboard Area -->
  <!-- Stats Cards -->
  <rect x="180" y="95" width="105" height="48" rx="6" fill="#111C30" stroke="#1E293B" stroke-width="1"/>
  <text x="190" y="110" fill="#94A3B8" font-family="sans-serif" font-size="8">Total Enrolled</text>
  <text x="190" y="130" fill="#38BDF8" font-family="sans-serif" font-size="15" font-weight="700">1,248</text>

