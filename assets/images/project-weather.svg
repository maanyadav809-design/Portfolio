<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09203F"/>
      <stop offset="100%" stop-color="#1E3C72"/>
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.9)"/>
      <stop offset="100%" stop-color="rgba(30, 41, 59, 0.85)"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#bgGrad4)"/>

  <!-- Ambient glow -->
  <circle cx="220" cy="160" r="120" fill="#38BDF8" opacity="0.15" filter="blur(35px)"/>
  <circle cx="420" cy="200" r="90" fill="#F59E0B" opacity="0.1" filter="blur(30px)"/>

  <!-- App Window -->
  <rect x="65" y="45" width="470" height="270" rx="12" fill="url(#cardGrad4)" stroke="#334155" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="65" y="45" width="470" height="36" rx="12" fill="#0A1526"/>
  <rect x="65" y="69" width="470" height="12" fill="#0A1526"/>
  <line x1="65" y1="81" x2="535" y2="81" stroke="#1E293B" stroke-width="1"/>

  <!-- Window controls -->
  <circle cx="87" cy="63" r="5" fill="#EF4444"/>
  <circle cx="103" cy="63" r="5" fill="#F59E0B"/>
  <circle cx="119" cy="63" r="5" fill="#10B981"/>

  <!-- Search bar inside app -->
  <rect x="175" y="52" width="220" height="22" rx="11" fill="#1A253C" stroke="#334155" stroke-width="1"/>
  <circle cx="190" cy="63" r="4" fill="none" stroke="#94A3B8" stroke-width="1.2"/>
  <line x1="193" y1="66" x2="197" y2="70" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="205" y="67" fill="#E2E8F0" font-family="sans-serif" font-size="9">San Francisco, CA</text>

  <!-- Left Weather Main Card -->
  <rect x="85" y="95" width="225" height="205" rx="10" fill="#131F37" stroke="#1E293B" stroke-width="1"/>
  
  <!-- Location & Time -->
  <text x="100" y="118" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="700">San Francisco</text>
  <text x="100" y="132" fill="#94A3B8" font-family="sans-serif" font-size="9">Wednesday, 2:30 PM • Sunny</text>

  <!-- Sun & Cloud Illustration -->
  <circle cx="135" cy="175" r="26" fill="url(#sunGrad)"/>
  <ellipse cx="155" cy="185" rx="30" ry="18" fill="#E2E8F0" opacity="0.95"/>
  <ellipse cx="140" cy="188" rx="20" ry="14" fill="#CBD5E1"/>

  <!-- Big Temperature -->
  <text x="200" y="180" fill="#FFFFFF" font-family="sans-serif" font-size="34" font-weight="800">24°</text>
  <text x="250" y="165" fill="#94A3B8" font-family="sans-serif" font-size="14">C</text>
  <text x="202" y="195" fill="#38BDF8" font-family="sans-serif" font-size="9" font-weight="600">Feels like 23°</text>

  <!-- Metrics row -->
  <line x1="95" y1="230" x2="300" y2="230" stroke="#1E293B" stroke-width="1"/>

  <text x="105" y="250" fill="#94A3B8" font-family="sans-serif" font-size="8">Wind</text>
  <text x="105" y="266" fill="#F1F5F9" font-family="sans-serif" font-size="10" font-weight="600">14 km/h</text>

  <text x="175" y="250" fill="#94A3B8" font-family="sans-serif" font-size="8">Humidity</text>
  <text x="175" y="266" fill="#F1F5F9" font-family="sans-serif" font-size="10" font-weight="600">58%</text>

  <text x="250" y="250" fill="#94A3B8" font-family="sans-serif" font-size="8">Precip</text>
  <text x="250" y="266" fill="#F1F5F9" font-family="sans-serif" font-size="10" font-weight="600">0%</text>

  <!-- Right Forecast & Hourly Panels -->
  <!-- Hourly forecast -->
  <rect x="325" y="95" width="195" height="95" rx="8" fill="#131F37" stroke="#1E293B" stroke-width="1"/>
  <text x="338" y="112" fill="#94A3B8" font-family="sans-serif" font-size="9" font-weight="700">HOURLY FORECAST</text>

  <rect x="335" y="122" width="40" height="58" rx="6" fill="#1B2945"/>
  <text x="343" y="136" fill="#94A3B8" font-family="sans-serif" font-size="8">Now</text>
  <circle cx="355" cy="148" r="7" fill="url(#sunGrad)"/>
  <text x="345" y="170" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="700">24°</text>

  <rect x="380" y="122" width="40" height="58" rx="6" fill="#131F37"/>
  <text x="388" y="136" fill="#94A3B8" font-family="sans-serif" font-size="8">4 PM</text>
  <circle cx="400" cy="148" r="7" fill="url(#sunGrad)"/>
  <text x="390" y="170" fill="#E2E8F0" font-family="sans-serif" font-size="9">23°</text>

  <rect x="425" y="122" width="40" height="58" rx="6" fill="#131F37"/>
  <text x="433" y="136" fill="#94A3B8" font-family="sans-serif" font-size="8">6 PM</text>
  <circle cx="445" cy="148" r="6" fill="#CBD5E1"/>
  <text x="435" y="170" fill="#E2E8F0" font-family="sans-serif" font-size="9">20°</text>

  <rect x="470" y="122" width="40" height="58" rx="6" fill="#131F37"/>
  <text x="478" y="136" fill="#94A3B8" font-family="sans-serif" font-size="8">8 PM</text>
  <circle cx="490" cy="148" r="6" fill="#94A3B8"/>
  <text x="480" y="170" fill="#E2E8F0" font-family="sans-serif" font-size="9">18°</text>

  <!-- REST API integration badge & 5-day snippet -->
  <rect x="325" y="200" width="195" height="100" rx="8" fill="#131F37" stroke="#1E293B" stroke-width="1"/>
  <text x="338" y="218" fill="#94A3B8" font-family="sans-serif" font-size="9" font-weight="700">DATA SOURCE &amp; API</text>

  <rect x="338" y="228" width="168" height="24" rx="5" fill="#0A1526"/>
  <text x="348" y="244" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="8">GET /v1/current.json</text>

  <rect x="338" y="260" width="85" height="28" rx="5" fill="rgba(6, 182, 212, 0.15)"/>
  <text x="346" y="277" fill="#22D3EE" font-family="sans-serif" font-size="8" font-weight="700">Async / Fetch</text>

  <rect x="428" y="260" width="78" height="28" rx="5" fill="rgba(16, 185, 129, 0.15)"/>
  <text x="437" y="277" fill="#10B981" font-family="sans-serif" font-size="8" font-weight="700">Responsive</text>
</svg>
