<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.9)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#bgGrad1)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.1" stroke="#94A3B8" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="360"/>
    <line x1="120" y1="0" x2="120" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="280" y1="0" x2="280" y2="360"/>
    <line x1="360" y1="0" x2="360" y2="360"/>
    <line x1="440" y1="0" x2="440" y2="360"/>
    <line x1="520" y1="0" x2="520" y2="360"/>
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
  </g>

  <!-- Glow effect behind mockup -->
  <circle cx="300" cy="180" r="140" fill="#6366F1" opacity="0.15" filter="blur(30px)"/>

  <!-- Browser Window Mockup -->
  <rect x="70" y="45" width="460" height="270" rx="12" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Browser top bar -->
  <rect x="70" y="45" width="460" height="34" rx="12" fill="#0F172A"/>
  <rect x="70" y="67" width="460" height="12" fill="#0F172A"/>
  <line x1="70" y1="79" x2="530" y2="79" stroke="#334155" stroke-width="1"/>

  <!-- Window controls -->
  <circle cx="92" cy="62" r="5" fill="#EF4444"/>
  <circle cx="108" cy="62" r="5" fill="#F59E0B"/>
  <circle cx="124" cy="62" r="5" fill="#10B981"/>

  <!-- URL Bar -->
  <rect x="150" y="53" width="220" height="18" rx="5" fill="#1E293B"/>
  <text x="162" y="66" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">https://portfolio.dev</text>

  <!-- Website Header inside mockup -->
  <rect x="90" y="95" width="60" height="12" rx="3" fill="url(#accentGrad1)"/>
  <rect x="420" y="97" width="24" height="8" rx="2" fill="#475569"/>
  <rect x="452" y="97" width="24" height="8" rx="2" fill="#475569"/>
  <rect x="484" y="97" width="24" height="8" rx="2" fill="#475569"/>

  <!-- Website Hero Preview inside mockup -->
  <text x="90" y="140" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16">Hello, I'm a Developer 👋</text>
  <rect x="90" y="152" width="180" height="8" rx="2" fill="#64748B"/>
  <rect x="90" y="166" width="130" height="8" rx="2" fill="#475569"/>

  <!-- Action Buttons -->
  <rect x="90" y="190" width="64" height="22" rx="6" fill="#38BDF8"/>
  <rect x="162" y="190" width="64" height="22" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>

  <!-- Interactive Code / Card on right side of mockup -->
  <rect x="310" y="125" width="200" height="150" rx="8" fill="#0B0F19" stroke="#334155" stroke-width="1"/>
  <circle cx="325" cy="140" r="3" fill="#64748B"/>
  <circle cx="335" cy="140" r="3" fill="#64748B"/>
  <circle cx="345" cy="140" r="3" fill="#64748B"/>

  <!-- Code lines -->
  <text x="325" y="165" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="9"><tspan fill="#F43F5E">const</tspan> student = {</text>
  <text x="337" y="180" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="9">role: <tspan fill="#38BDF8">'2nd Year CSE'</tspan>,</text>
  <text x="337" y="195" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="9">focus: <tspan fill="#10B981">'Software Eng'</tspan>,</text>
  <text x="337" y="210" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="9">openForInternship: <tspan fill="#FBBF24">true</tspan></text>
  <text x="325" y="225" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="9">};</text>

  <!-- Mini Tag Badges -->
  <rect x="90" y="238" width="45" height="18" rx="4" fill="rgba(56, 189, 248, 0.15)"/>
  <text x="98" y="251" fill="#38BDF8" font-family="sans-serif" font-size="9" font-weight="600">HTML5</text>

  <rect x="142" y="238" width="45" height="18" rx="4" fill="rgba(99, 102, 241, 0.15)"/>
  <text x="151" y="251" fill="#818CF8" font-family="sans-serif" font-size="9" font-weight="600">CSS3</text>

  <rect x="194" y="238" width="60" height="18" rx="4" fill="rgba(245, 158, 11, 0.15)"/>
  <text x="201" y="251" fill="#FBBF24" font-family="sans-serif" font-size="9" font-weight="600">JavaScript</text>
</svg>
